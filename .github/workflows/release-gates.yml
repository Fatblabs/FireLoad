name: Release Gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y zip unzip

      - name: Check extension structure
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Lint with web-ext
        run: npx --yes web-ext@10.3.0 lint --source-dir .

      - name: Build XPI
        run: npm run build

      - name: Create source archive
        run: npm run source:zip

      - name: Setup Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Setup geckodriver
        uses: browser-actions/setup-geckodriver@v1

      - name: Install isolated browser test dependencies
        run: npm install --prefix "$RUNNER_TEMP/fireload-automation" --ignore-scripts --no-audit --no-fund selenium-webdriver@4.44.0

      - name: Verify prefetching and navigation cache in Firefox
        env:
          FIREFOX_BINARY: ${{ steps.firefox.outputs.firefox-path }}
          NODE_PATH: ${{ runner.temp }}/fireload-automation/node_modules
        run: npm run test:firefox
